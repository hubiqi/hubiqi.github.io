name: dns-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query DoH
        run: |
          python3 - <<'PY'
          import json, urllib.request
          def q(name):
              url = 'https://cloudflare-dns.com/dns-query?name=' + name + '&type=A'
              req = urllib.request.Request(url, headers={'accept': 'application/dns-json'})
              try:
                  d = json.loads(urllib.request.urlopen(req, timeout=20).read())
              except Exception as e:
                  print(name, 'QUERY FAILED', e); return
              an = [a['data'] for a in (d.get('Answer') or [])]
              au = [a['data'] for a in (d.get('Authority') or [])]
              st = d.get('Status')
              tag = ''
              if st == 0 and not an and au: tag = '   <== NODATA: apex exists, ZERO records'
              elif st == 3: tag = '   <== NXDOMAIN'
              print('%-46s Status=%s Answer=%s%s' % (name, st, an[:2] if an else '[]', tag))
          print('=== 不同账号的 workers.dev 根域 ===')
          for n in ['hubiqi.workers.dev', 'cloudflare.workers.dev', 'demo.workers.dev', 'myapp.workers.dev', 'hello.workers.dev']:
              q(n)
          print('=== 同一账号下的具体 Worker ===')
          for n in ['hubiqi.hubiqi.workers.dev', 'a-random-worker-zz9.hubiqi.workers.dev']:
              q(n)
          print('=== 对照 pages.dev ===')
          for n in ['hubiqi.pages.dev', 'pages.dev']:
              q(n)
          PY
