name: 站点外部探测（境外节点）

# 用途：本机网络对 *.workers.dev 等域名 DNS 被污染，无法本地验证。
# 手动触发一次，即可从境外节点确认各站点真实可达性。
#   触发：GitHub → Actions → 本工作流 → Run workflow
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 逐个探测
        run: |
          echo "| 地址 | 状态 | 大小 | 首行 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          for u in \
            "https://hubiqi.pages.dev/" \
            "https://hubiqi-dash.pages.dev/" \
            "https://hubiqi-dashboard.pages.dev/" \
            "https://hubiqi.github.io/" ; do
            code=$(curl -s -m 20 -o /tmp/b.txt -w '%{http_code}' "$u" || echo ERR)
            size=$(wc -c < /tmp/b.txt 2>/dev/null || echo 0)
            echo "== $u -> HTTP=$code bytes=$size"
            echo "| $u | $code | $size |" >> $GITHUB_STEP_SUMMARY
          done
